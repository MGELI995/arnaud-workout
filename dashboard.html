<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<title>Arnaud</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --bg:    #0f0f0f;
  --bg2:   #161616;
  --bg3:   #1e1e1e;
  --text:  #f0f0f0;
  --muted: #5a5a5a;
  --dim:   #333;
  --green: #22c55e;
  --font:  -apple-system, 'Inter', 'Segoe UI', sans-serif;
  --nav-h: 54px;
  --hdr-h: 48px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  height: var(--hdr-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--bg2);
}
.h-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.01em;
}
.h-right { display:flex; align-items:center; gap:10px; }
#clock { font-size: 13px; color: var(--muted); font-weight: 400; }
.sdot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--dim);
  transition: background 0.3s;
}
.sdot.ok      { background: var(--green); }
.sdot.pending { background: #f59e0b; animation: pulse 1s infinite; }
.sdot.error   { background: #ef4444; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

/* ── VIEWS ── */
.view { flex:1; overflow-y:auto; display:none; -webkit-overflow-scrolling:touch; }
.view.active { display:block; }
.content { padding: 8px 20px calc(var(--nav-h) + 20px); max-width: 520px; margin: 0 auto; }

/* ── NAV ── */
nav {
  height: var(--nav-h);
  display: flex;
  border-top: 1px solid var(--bg2);
  flex-shrink: 0;
  background: var(--bg);
}
.tab {
  flex:1;
  background: none;
  border: none;
  color: var(--muted);
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: color 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.tab svg { opacity: 0.4; transition: opacity 0.15s; }
.tab.active { color: var(--text); }
.tab.active svg { opacity: 1; }

/* ── SCORES ── */
.scores-wrap {
  display: flex;
  align-items: center;
  padding: 16px 0 20px;
  gap: 0;
}
.score-block {
  flex: 1;
  text-align: center;
}
.score-label {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.06em;
  margin-bottom: 4px;
  text-transform: uppercase;
}
.score-num {
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
  transition: color 0.3s;
}
.score-divider {
  width: 1px;
  height: 32px;
  background: var(--bg2);
  flex-shrink: 0;
}

/* ── SECTION ── */
.section {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.03em;
  padding: 20px 0 6px;
}

/* ── HABIT ROW ── */
.row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 0;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.1s;
  margin: 0 -8px;
  padding-left: 8px;
  padding-right: 8px;
}
.row:active { background: var(--bg2); }

.circle {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--dim);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.circle svg { display:none; }
.row.done .circle {
  background: var(--green);
  border-color: var(--green);
}
.row.done .circle svg { display:block; }

.ri { flex:1; min-width:0; }
.rn {
  font-size: 14px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.3;
}
.rd {
  font-size: 11px;
  color: var(--muted);
  margin-top: 1px;
}
.row.done .rn {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: var(--dim);
}

/* ── DEEN ROW ── */
.drow {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 8px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.1s;
  margin: 0 -8px;
}
.drow:active { background: var(--bg2); }

.dcircle {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--dim);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
  color: var(--muted);
  transition: all 0.15s;
}
.drow.partial .dcircle { border-color: var(--green); color: var(--green); }
.drow.full    .dcircle { background: var(--green); border-color: var(--green); color: #000; }
.drow.full    .rn { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--dim); }
.circle-fail { border-color: #ef4444 !important; }
.row.hifz-fail .rn { color: #ef4444; }

.dots-wrap { display:flex; gap:3px; flex-shrink:0; }
.d { width:5px; height:5px; border-radius:50%; background:var(--dim); transition:background 0.15s; }
.d.on { background: var(--green); }

/* ── RAWATIB TOGGLE ── */
.rt {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 8px;
  margin: 0 -8px;
  cursor: pointer;
  border-radius: 8px;
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
  user-select: none;
  transition: background 0.1s;
}
.rt:active { background: var(--bg2); }
.rt-arrow { font-size: 9px; transition: transform 0.2s; }
.rt.open .rt-arrow { transform: rotate(90deg); }
.rbody { display:none; }
.rbody.open { display:block; }

/* ── NOTE ── */
.note-wrap { padding: 8px 0 0; }
.note {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--bg3);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 12px 14px;
  resize: none;
  min-height: 64px;
  outline: none;
  line-height: 1.6;
  transition: border-color 0.2s;
}
.note:focus { border-color: var(--dim); }
.note::placeholder { color: var(--dim); }

/* ── BUTTON ── */
.btn {
  width: 100%;
  height: 46px;
  background: var(--bg2);
  border: 1px solid var(--bg3);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 12px;
  transition: all 0.15s;
}
.btn:active { background: var(--bg3); }
.btn.saved { opacity:0.35; pointer-events:none; }
.btn.success { color: var(--green); border-color: rgba(34,197,94,0.25); }

/* ══════════ TIME VIEW ══════════ */

.t-summary { padding: 4px 0; }
.trow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
}
.trow + .trow { border-top: 1px solid var(--bg2); }
.tcat { font-size: 13px; color: var(--text); }
.tval { font-size: 13px; font-weight: 500; color: var(--green); }
.trow.total .tcat { color: var(--muted); font-size:11px; font-weight:500; }
.t-empty { font-size: 13px; color: var(--muted); padding: 10px 0; }

.cgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}
.cbtn {
  padding: 11px 6px;
  background: var(--bg2);
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--muted);
  font-family: var(--font);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
  cursor: pointer;
  text-align: center;
  transition: all 0.12s;
}
.cbtn.sel { border-color: var(--green); color: var(--green); background: rgba(34,197,94,0.06); }
.cbtn:active { opacity:0.6; }

.dgrid {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.dbtn {
  flex:1;
  min-width: 42px;
  height: 38px;
  background: var(--bg2);
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--muted);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
}
.dbtn.sel { border-color: var(--green); color: var(--green); background: rgba(34,197,94,0.06); }
.dbtn:active { opacity:0.6; }

.t-actions { display:flex; gap:8px; margin-top: 4px; }
.btnadd {
  flex:1; height:46px;
  background: var(--bg2);
  border: 1px solid var(--bg3);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
}
.btnadd:active { background:var(--bg3); }
.btnadd.ready { border-color: rgba(34,197,94,0.4); color: var(--green); }
.btnadd:disabled { opacity:0.25; pointer-events:none; }
.btnundo {
  width:46px; height:46px;
  background: var(--bg2);
  border: 1px solid var(--bg3);
  border-radius: 10px;
  color: var(--muted);
  font-family: var(--font);
  font-size: 16px;
  cursor: pointer;
  transition: all 0.12s;
}
.btnundo:active { color: var(--text); }
.btnundo:disabled { opacity:0.15; pointer-events:none; }

/* ── DATE NAV ── */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg2);
  flex-shrink: 0;
}
.dnav-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 6px;
  transition: all 0.12s;
  font-family: var(--font);
}
.dnav-btn:active { background: var(--bg2); color: var(--text); }
.dnav-btn:disabled { opacity: 0.2; pointer-events: none; }
.dnav-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  min-width: 160px;
  text-align: center;
}
.dnav-label.past { color: var(--muted); }

/* ── INFO BTN ── */
.info-btn {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1px solid var(--bg3);
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
  font-family: var(--font);
}
.info-btn:active { border-color: var(--text); color: var(--text); }

/* ── OVERLAY ── */
.overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 100;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.overlay.open { display: flex; }
.ov-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--bg2);
  flex-shrink: 0;
}
.ov-title { font-size: 13px; font-weight: 600; }
.ov-close {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg2); border: none;
  color: var(--muted); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.1s;
}
.ov-close:active { color: var(--text); }
.ov-body {
  flex: 1; overflow-y: auto; padding: 24px 20px;
  -webkit-overflow-scrolling: touch;
  max-width: 520px; margin: 0 auto; width: 100%;
}
.card-block {
  margin-bottom: 32px; padding-bottom: 32px;
  border-bottom: 1px solid var(--bg2);
}
.card-block:last-child { border-bottom: none; margin-bottom: 0; }
.card-ar {
  font-size: 24px; line-height: 2;
  text-align: right; direction: rtl;
  color: var(--text); margin-bottom: 14px;
  font-family: 'Scheherazade New', 'Amiri', serif;
}
.card-ph {
  font-size: 12px; color: var(--muted);
  line-height: 1.7; margin-bottom: 12px; font-style: italic;
}
.card-tr {
  font-size: 14px; color: var(--text);
  line-height: 1.7; margin-bottom: 10px;
}
.card-ctx {
  font-size: 11px; color: var(--muted); line-height: 1.6;
}
.card-ctx em { font-style: italic; color: #aaa; }
.card-ctx strong { color: var(--text); font-weight: 500; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--bg3);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 12px;
  color: var(--text);
  font-weight: 500;
  z-index: 999;
  transition: transform 0.22s cubic-bezier(.34,1.56,.64,1);
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <span class="h-name">Arnaud</span>
  <div class="h-right">
    <span id="clock"></span>
    <span class="sdot" id="sdot"></span>
  </div>
</header>
<div class="date-nav">
  <button class="dnav-btn" onclick="prevDay()">←</button>
  <span class="dnav-label" id="dateLabel"></span>
  <button class="dnav-btn" id="nextBtn" onclick="nextDay()">→</button>
</div>

<!-- ═══════════ HABITS ═══════════ -->
<div class="view active" id="v-habits">
<div class="content">

  <div class="scores-wrap">
    <div class="score-block">
      <div class="score-label">Alignement</div>
      <div class="score-num" id="scoreAlign">0%</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-block">
      <div class="score-label">Deen</div>
      <div class="score-num" id="scoreDeen">0%</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-block">
      <div class="score-label">Dounia</div>
      <div class="score-num" id="scoreDounia">0%</div>
    </div>
  </div>

  <div class="section">Quotidien</div>
  <div id="hlist"></div>

  <div class="section">Deen</div>
  <div id="dlist"></div>

  <div class="rt" id="rt" onclick="toggleR()">
    <span>Rawātib</span>
    <span class="rt-arrow">▶</span>
  </div>
  <div class="rbody" id="rbody">
    <div id="rlist"></div>
  </div>

  <div class="section">Note du jour</div>
  <div class="note-wrap">
    <textarea class="note" id="noteEl" placeholder="Note libre…" oninput="saveNote()"></textarea>
  </div>


</div>
</div>

<!-- ═══════════ TIME ═══════════ -->
<div class="view" id="v-time">
<div class="content">

  <div class="section" style="padding-top:12px">Aujourd'hui</div>
  <div class="t-summary" id="tsummary">
    <div class="t-empty">Aucune session enregistrée</div>
  </div>

  <div class="section">Catégorie</div>
  <div class="cgrid" id="cgrid"></div>

  <div class="section">Durée</div>
  <div class="dgrid" id="dgrid"></div>

  <div class="t-actions">
    <button class="btnadd" id="btnadd" onclick="addTime()" disabled>Ajouter</button>
    <button class="btnundo" id="btnundo" onclick="undoLast()" disabled>↩</button>
  </div>

</div>
</div>

<!-- NAV -->
<nav>
  <button class="tab active" id="tab-habits" onclick="switchTab('habits')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
    </svg>
    Habits
  </button>
  <button class="tab" id="tab-time" onclick="switchTab('time')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
    Time
  </button>
</nav>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="ov-header">
    <span class="ov-title" id="ovTitle"></span>
    <button class="ov-close" onclick="closeCard()">×</button>
  </div>
  <div class="ov-body" id="ovBody"></div>
</div>

<div class="toast" id="toast"></div>

let currentDate = '';

function date() {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function renderDateNav() {
  const today = date();
  const isToday = currentDate === today;
  const d = new Date(currentDate + 'T12:00:00');
  const label = isToday
    ? 'Aujourd\'hui'
    : d.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'long'});
  const el = document.getElementById('dateLabel');
  el.textContent = label;
  el.className = 'dnav-label' + (isToday ? '' : ' past');
  document.getElementById('nextBtn').disabled = isToday;
}

function prevDay() {
  const d = new Date(currentDate + 'T12:00:00');
  d.setDate(d.getDate()-1);
  currentDate = d.toISOString().split('T')[0];
  loadDay();
}

function nextDay() {
  if (currentDate >= date()) return;
  const d = new Date(currentDate + 'T12:00:00');
  d.setDate(d.getDate()+1);
  currentDate = d.toISOString().split('T')[0];
  loadDay();
}

async function loadDay() {
  hs={}; ds={}; rs={}; note='';
  tlog={}; lastEntry=null;
  selCat=null; selMins=null;
  renderDateNav();
  renderHabits(); renderDeen(); renderRawatib(); renderXP();
  renderCats(); renderDurs(); renderSummary();
  document.getElementById('noteEl').value='';
  document.getElementById('btnundo').disabled=true;
  await Promise.all([loadHL(), loadTL()]);
  renderHabits(); renderDeen(); renderRawatib(); renderXP();
  renderSummary();
}

function fmt(m) {
  if(!m) return '0m';
  const h=Math.floor(m/60),r=m%60;
  return h?(r?`${h}h${r}m`:`${h}h`):`${m}m`;
}

let toastT;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),2000);
}
function sync(st) { document.getElementById('sdot').className='sdot '+st; }

function clock() {
  const n=new Date();
  document.getElementById('clock').textContent=
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
clock(); setInterval(clock,10000);

function switchTab(t) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('v-'+t).classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
}

// ─── HABITS ───
function scoreJour() {
  // Ḥifẓ al-farj = weight:6, autres = weight:1 (multi-coches = 1 si ≥1)
  let total=0, done=0;
  HABITS.forEach(h=>{
    const w=h.weight||1;
    total+=w;
    const val=typeof hs[h.id]==='number'?hs[h.id]:(hs[h.id]?1:0);
    if(val>0) done+=w;
  });
  return total>0?Math.round(done/total*100):0;
}

function xpDeen() {
  let x=0;
  DEEN.forEach(d=>{x+=(ds[d.id]||0)*d.xp;});
  RAWATIB.forEach(r=>{if(rs[r.id])x+=r.xp;});
  return x;
}
function xpDeenMax() {
  const d=DEEN.reduce((s,x)=>s+x.max*x.xp,0);
  const r=RAWATIB.reduce((s,x)=>s+x.xp,0);
  return d+r;
}
function xpTotal(){ return xpDeen(); }

function color(pct) {
  return pct>=80?'var(--green)':pct>=50?'#f59e0b':'#ef4444';
}

function renderXP() {
  const dounia = scoreJour();
  const deenPct = Math.min(Math.round(xpDeen()/500*100), 100);
  const align = Math.round(deenPct*0.6 + dounia*0.4);

  const elA = document.getElementById('scoreAlign');
  const elD = document.getElementById('scoreDeen');
  const elQ = document.getElementById('scoreDounia');

  elA.textContent = align+'%';   elA.style.color = color(align);
  elD.textContent = deenPct+'%'; elD.style.color = color(deenPct);
  elQ.textContent = dounia+'%';  elQ.style.color = color(dounia);
}

function renderHabits() {
  document.getElementById('hlist').innerHTML=HABITS.map(h=>{
    if(h.max && h.max>1){
      const c=hs[h.id]||0, full=c>=h.max, partial=c>0&&!full;
      const cls=full?'full':partial?'partial':'';
      const lbl=full?CHECK_SVG:partial?c:'';
      const dots=`<div class="dots-wrap">${Array.from({length:h.max},(_,i)=>`<div class="d ${i<c?'on':''}"></div>`).join('')}</div>`;
      return `<div class="drow ${cls}" onclick="tH('${h.id}')">
        <div class="dcircle">${lbl}</div>
        <div class="ri"><div class="rn">${h.name}</div><div class="rd">${h.desc}</div></div>
        ${dots}
      </div>`;
    }
    const done=!!hs[h.id];
    return `<div class="row ${done?'done':''}" onclick="tH('${h.id}')">
      <div class="circle">${done?CHECK_SVG:''}</div>
      <div class="ri"><div class="rn">${h.name}</div><div class="rd">${h.desc}</div></div>
    </div>`;
  }).join('');
}

function renderDeen() {
  document.getElementById('dlist').innerHTML=DEEN.map(d=>{
    const c=ds[d.id]||0, full=c>=d.max, partial=c>0&&!full;
    const cls=full?'full':partial?'partial':'';
    const lbl=full?CHECK_SVG:partial?c:'';
    const dotsHtml=d.max>1
      ?`<div class="dots-wrap">${Array.from({length:d.max},(_,i)=>`<div class="d ${i<c?'on':''}"></div>`).join('')}</div>`:'';
    const infoBtn=CARDS[d.id]
      ?`<button class="info-btn" onclick="openCard(event,'${d.id}')">i</button>`:'';
    return `
    <div class="drow ${cls}" onclick="tD('${d.id}')">
      <div class="dcircle">${lbl}</div>
      <div class="ri">
        <div class="rn">${d.name}</div>
        <div class="rd">${d.desc}</div>
      </div>
      ${dotsHtml}
      ${infoBtn}
    </div>`;
  }).join('');
}

      <div class="card-tr">${c.tr}</div>
      <div class="card-ctx">${c.ctx}</div>
    </div>`).join('');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeCard() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}

function renderRawatib() {
  document.getElementById('rlist').innerHTML=RAWATIB.map(r=>`
    <div class="row ${rs[r.id]?'done':''}" onclick="tR('${r.id}')">
      <div class="circle">${rs[r.id]?CHECK_SVG:''}</div>
      <div class="ri">
        <div class="rn">${r.name}</div>
        <div class="rd">${r.desc}</div>
      </div>
    </div>`).join('');
}

function tH(id){
  const h=HABITS.find(x=>x.id===id);
  if(h&&h.max&&h.max>1){ hs[id]=((hs[id]||0)>=h.max)?0:(hs[id]||0)+1; }
  else{ hs[id]=!hs[id]; }
  saveHL();renderHabits();renderXP();pushHabits();
}
function tD(id){const d=DEEN.find(x=>x.id===id);ds[id]=(ds[id]||0)>=d.max?0:(ds[id]||0)+1;saveHL();renderDeen();renderXP();pushHabits();}
function tR(id){rs[id]=!rs[id];saveHL();renderRawatib();renderXP();pushHabits();}

let noteTimer;
function saveNote(){
  note=document.getElementById('noteEl').value;
  localStorage.setItem('hn_'+currentDate,note);
  clearTimeout(noteTimer);
  noteTimer=setTimeout(pushHabits, 1500);
}

function toggleR(){
  const b=document.getElementById('rbody'),t=document.getElementById('rt');
  const open=b.classList.toggle('open');
  t.classList.toggle('open',open);
}

function saveHL(){localStorage.setItem('hs_'+currentDate,JSON.stringify({hs,ds,rs}));}

async function loadHL(){
  const d=currentDate;
  // Affichage immédiat depuis localStorage
  const raw=localStorage.getItem('hs_'+d);
  if(raw){const p=JSON.parse(raw);hs=p.hs||{};ds=p.ds||{};rs=p.rs||{};}
  // Toujours fetch GitHub pour sync multi-appareils
  try{
    const r=await fetch(WORKER+'?date='+d+'&section=HABITS&t='+Date.now());
    if(r.ok){
      const {text}=await r.json();
      if(text){
        const m=text.match(/<!-- STATE:(.*?) -->/);
        if(m){
          const p=JSON.parse(m[1]);
          hs=p.hs||{}; ds=p.ds||{}; rs=p.rs||{};
          saveHL();
          renderHabits(); renderDeen(); renderRawatib(); renderXP();
        }
      }
    }
  }catch(e){}
  note=localStorage.getItem('hn_'+d)||'';
  document.getElementById('noteEl').value=note;
}

let hPushBusy=false, hPushQueued=false;
async function pushHabits(){
  if(hPushBusy){hPushQueued=true;return;}
  hPushBusy=true; sync('pending');
  const d=currentDate, done=HABITS.filter(h=>hs[h.id]).length, xp=xpDeen();
  const score=Math.round(done/HABITS.length*100);
  let content=`# HABITS — ${d}\n\n**Score : ${score}% (${done}/${HABITS.length})**\n**DEEN XP : ${xp} / 500**\n\n`;
  if(note.trim()) content+=`## Note du jour\n\n> ${note.trim()}\n\n`;
  content+=`## Rituels\n\n`;
  HABITS.forEach(h=>{content+=`- ${hs[h.id]?'✅':'❌'} ${h.name}\n`;});
  content+=`\n## DEEN\n\n`;
  DEEN.forEach(item=>{const s=ds[item.id]||0;content+=`- ${s>0?'✅':'❌'} ${item.name}${item.max>1?` (${s}/${item.max})`:''} | XP: +${s*item.xp}\n`;});
  const rawDone=RAWATIB.filter(r=>rs[r.id]);
  if(rawDone.length){content+=`\n### Rawātib\n\n`;RAWATIB.forEach(r=>{content+=`- ${rs[r.id]?'✅':'❌'} ${r.name} | XP: +${rs[r.id]?r.xp:0}\n`;});}
  const md=xp>=500;
  content+=`\n## MUSLIM DAY\n\n- ${md?'✅':'❌'} MUSLIM DAY — ${xp} / 500 XP DEEN\n`;
  content+=md?`- ⭐ Objectif DEEN atteint\n`:`- ${500-Math.min(xp,500)} XP manquants\n`;
  content+=`\nDEEN_DATA — Total XP: ${xp} / ${xpDeenMax()} | Muslim Day: ${md?'OUI':'NON'}\n`;
  content+=`<!-- STATE:${JSON.stringify({hs,ds,rs})} -->`;
  const body=JSON.stringify({content,date:d,section:'HABITS'});
  let ok=false;
  for(let i=0;i<3;i++){
    try{const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body});if(r.ok){ok=true;break};}catch(e){}
  }
  sync(ok?'ok':'error');
  hPushBusy=false;
  if(hPushQueued){hPushQueued=false;pushHabits();}
}

async function saveHabits(){
  const d=date(), done=HABITS.filter(h=>hs[h.id]).length, xp=xpTotal();
  const score=Math.round(done/HABITS.length*100);
  let content=`# HABITS — ${d}\n\n**Score : ${score}% (${done}/${HABITS.length})**\n**DEEN XP : ${xp} / 500**\n\n`;
  if(note.trim()) content+=`## Note du jour\n\n> ${note.trim()}\n\n`;
  content+=`## Rituels\n\n`;
  HABITS.forEach(h=>{content+=`- ${hs[h.id]?'✅':'❌'} ${h.name}\n`;});
  content+=`\n## DEEN\n\n`;
  DEEN.forEach(item=>{const s=ds[item.id]||0;content+=`- ${s>0?'✅':'❌'} ${item.name}${item.max>1?` (${s}/${item.max})`:''} | XP: +${s*item.xp}\n`;});
  const rawDone=RAWATIB.filter(r=>rs[r.id]);
  if(rawDone.length){content+=`\n### Rawātib\n\n`;RAWATIB.forEach(r=>{content+=`- ${rs[r.id]?'✅':'❌'} ${r.name} | XP: +${rs[r.id]?r.xp:0}\n`;});}
  const md=xp>=500;
  content+=`\n## MUSLIM DAY\n\n- ${md?'✅':'❌'} MUSLIM DAY — ${xp} / 500 XP DEEN\n`;
  content+=md?`- ⭐ Objectif DEEN atteint\n`:`- ${500-xp} XP manquants\n`;
  content+=`\nDEEN_DATA — Total XP: ${xp} / ${xpDeenMax()} | Muslim Day: ${md?'OUI':'NON'}\n`;

  const btn=document.getElementById('saveBtn');
  btn.textContent='…'; btn.classList.add('saved'); sync('pending');
  const body=JSON.stringify({content,date:d,section:'HABITS'});
  let ok=false;
  for(let i=0;i<3;i++){
    try{const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body});if(r.ok){ok=true;break};}catch(e){}
  }
  sync(ok?'ok':'error');
  btn.classList.remove('saved');
  if(ok){btn.textContent='Sauvegardé ✓';btn.classList.add('success');toast(`${done}/${HABITS.length} habits · ${xp} XP${xp>=500?' · Muslim Day':''}`);}
  else{btn.textContent='Erreur';}
  setTimeout(()=>{btn.textContent='Sauvegarder';btn.classList.remove('success');},2500);
}

// ─── TIME ───
function renderSummary(){
  const entries=CATS.filter(c=>tlog[c]>0);
  if(!entries.length){document.getElementById('tsummary').innerHTML='<div class="t-empty">Aucune session enregistrée</div>';return;}
  const total=entries.reduce((a,c)=>a+(tlog[c]||0),0);
  document.getElementById('tsummary').innerHTML=
    entries.map(c=>`<div class="trow"><span class="tcat">${c}</span><span class="tval">${fmt(tlog[c])}</span></div>`).join('')
    +`<div class="trow total"><span class="tcat">Total</span><span class="tval">${fmt(total)}</span></div>`;
}

function renderCats(){
  document.getElementById('cgrid').innerHTML=CATS.map(c=>
    `<button class="cbtn ${selCat===c?'sel':''}" onclick="selC('${c}')">${c}</button>`
  ).join('');
}

function renderDurs(){
  document.getElementById('dgrid').innerHTML=DURS.map(d=>
    `<button class="dbtn ${selMins===d?'sel':''}" onclick="selD(${d})">${fmt(d)}</button>`
  ).join('');
}

function selC(c){selCat=selCat===c?null:c;renderCats();checkAdd();}
function selD(d){selMins=selMins===d?null:d;renderDurs();checkAdd();}
function checkAdd(){
  const btn=document.getElementById('btnadd');
  const ready=!!(selCat&&selMins);
  btn.disabled=!ready;
  btn.classList.toggle('ready',ready);
}

function addTime(){
  if(!selCat||!selMins)return;
  lastEntry={cat:selCat,mins:selMins};
  tlog[selCat]=(tlog[selCat]||0)+selMins;
  saveTL(); pushTime();
  toast(`+${fmt(selMins)} ${selCat}`);
  renderSummary();
  document.getElementById('btnundo').disabled=false;
  selCat=null;selMins=null;renderCats();renderDurs();checkAdd();
}

function undoLast(){
  if(!lastEntry)return;
  tlog[lastEntry.cat]=Math.max(0,(tlog[lastEntry.cat]||0)-lastEntry.mins);
  if(!tlog[lastEntry.cat])delete tlog[lastEntry.cat];
  toast(`↩ -${fmt(lastEntry.mins)} ${lastEntry.cat}`);
  lastEntry=null;saveTL();pushTime();renderSummary();
  document.getElementById('btnundo').disabled=true;
}

function saveTL(){localStorage.setItem('tl_'+currentDate,JSON.stringify({log:tlog}));}

async function loadTL(){
  const d=currentDate;
  const raw=localStorage.getItem('tl_'+d);
  if(raw){tlog=JSON.parse(raw).log||{};return;}
  try{
    const r=await fetch(WORKER+'?date='+d+'&section=TIME_FOCUS');
    if(r.ok){const {text}=await r.json();if(text){text.split('\n').forEach(l=>{const m=l.match(/^([A-Z ]+)::\s*(\d+)/);if(m)tlog[m[1].trim()]=parseInt(m[2])||0;});saveTL();}}
  }catch(e){}
}

async function pushTime(){
  if(pushBusy){pushQueued=true;return;}
  pushBusy=true;sync('pending');
  const d=currentDate;
  const content=`## TIME FOCUS\n\n`+CATS.map(c=>`${c}:: ${tlog[c]||0}`).join('\n');
  const body=JSON.stringify({content,date:d,section:'TIME_FOCUS'});
  let ok=false;
  for(let i=0;i<3;i++){
    try{const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body});if(r.ok){ok=true;break};}catch(e){}
    if(i<2)await new Promise(r=>setTimeout(r,1500*(i+1)));
  }
  sync(ok?'ok':'error');
  pushBusy=false;
  if(pushQueued){pushQueued=false;pushTime();}
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&Object.keys(tlog).length>0)pushTime();
});

async function init(){
  currentDate = date();
  renderDateNav();
  await Promise.all([loadHL(),loadTL()]);
  renderHabits();renderDeen();renderRawatib();renderXP();
  renderCats();renderDurs();renderSummary();
}
init();
</script>
</body>
